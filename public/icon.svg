<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Outer Tech Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0891b2" stroke-width="3" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#06b6d4" stroke-width="4" stroke-dasharray="60 30" opacity="0.8"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
  
  <!-- Glowing Center Arc Reactor -->
  <circle cx="256" cy="256" r="90" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="50" fill="#ecfeff" filter="url(#glow)"/>
  
  <!-- Reactor Segments / Triangles -->
  <g stroke="#083344" stroke-width="6" fill="none">
    <line x1="256" y1="120" x2="256" y2="70" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="392" x2="256" y2="442" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="256" x2="70" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="392" y1="256" x2="442" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <line x1="160" y1="160" x2="125" y2="125" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="352" y1="352" x2="387" y2="387" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="352" y1="160" x2="387" y2="125" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="160" y1="352" x2="125" y2="387" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- Inner Core Detail -->
  <circle cx="256" cy="256" r="28" fill="#ffffff"/>
</svg>
